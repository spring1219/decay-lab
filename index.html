<script>
"use strict";

const models = [
  { key: "single" },
  { key: "double" },
  { key: "stretched" }
];

function parseCsv(csv) {
  const lines = csv.replace(/^\uFEFF/, "").trim().split(/\r?\n/).filter(line => line.trim());
  const hasHeader = /^\s*"?(?:time|x)"?\s*[,;\t]\s*"?signal"?\s*$/i.test(lines[0] || "");
  const rows = lines.slice(Number(hasHeader));
  if (rows.length < 12 || rows.length > 2000) throw Error("csvCount");
  const separator = rows[0].includes("\t") ? "\t" : rows[0].includes(";") ? ";" : ",";
  const number = /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i;
  const data = rows.map((line, index) => {
    const columns = line.split(separator).map(s => s.trim().replace(/^"(.*)"$/, "$1").trim());
    if (columns.length !== 2 || columns.some(s => !number.test(s) || !Number.isFinite(Number(s)))) {
      throw Object.assign(Error("csvNumbers"), { detail:index + 1 + Number(hasHeader) });
    }
    return columns.map(Number);
  }).sort((a, b) => a[0] - b[0]);
  if (data.some((row, i) => i > 0 && row[0] === data[i - 1][0])) {
    throw Error("duplicateX");
  }
  return data;
}

function randomGenerator(seed) {
  return function () {
    seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
    return (seed + 0.5) / 4294967296;
  };
}
const gaussian = rng => Math.sqrt(-2 * Math.log(rng())) * Math.cos(2 * Math.PI * rng());

function generate(count, kind, rng, config) {
  const rate = config ? config.rate : 0.85 + 2.9 * rng();
  const fast = config ? config.fast : 3.5 + 11 * rng();
  const mix = config ? config.mix : 0.27 + 0.47 * rng();
  const beta = config ? config.beta : 0.42 + 0.43 * rng();
  const noise = config ? config.noise : 0.008 + 0.067 * rng();
  const scale = config ? config.scale : 0.35 + 2.4 * rng();
  const baseline = config ? config.base : -0.15 + 0.45 * rng();
  const duration = config ? config.duration : 1;
  return Array.from({ length: count }, (_, i) => {
    const t = i / (count - 1);
    const primary = Math.exp(-rate * t);
    const shape = kind === 0 ? primary :
      kind === 1 ? (1 - mix) * primary + mix * Math.exp(-fast * t) :
      Math.exp(-Math.pow(rate * t, beta));
    return [t * duration, baseline + scale * (shape + noise * gaussian(rng))];
  });
}

function normalized(data) {
  const first = data[0][0];
  const duration = data[data.length - 1][0] - first;
  let divisor = 0;
  for (const [, y] of data) divisor = Math.max(divisor, Math.abs(y));
  if (!Number.isFinite(duration) || duration <= 0 || divisor === 0) {
    throw Error("invalidSpan");
  }
  const values = data.map(([, y]) => y / divisor);
  const low = Math.min(...values);
  const signalSpan = Math.max(...values) - low;
  if (signalSpan <= 1e-12) throw Error("lowVariation");
  const rows = data.map(([t], i) => [(t - first) / duration, (values[i] - low) / signalSpan]);
  if (rows.some(([x], i) => i > 0 && x <= rows[i - 1][0])) throw Error("predictorPrecision");
  return {duration,divisor,low,signalSpan,data:rows};
}

const featureCount = 20;

function features(data) {
  const result = [];
  let index = 0;
  for (let i = 0; i < featureCount; i += 1) {
    const t = i / (featureCount - 1);
    while (index + 1 < data.length - 1 && data[index + 1][0] < t) index += 1;
    const [a, ya] = data[index];
    const [b, yb] = data[index + 1];
    result.push(ya + (yb - ya) * (t - a) / (b - a));
  }
  const mean = result.reduce((sum, value) => sum + value, 0) / result.length;
  const centered = result.map(value => value - mean);
  const magnitude = Math.hypot(...centered);
  if (magnitude <= 1e-12) return null;
  return centered.map(value => value / magnitude);
}

function distances(query, examples) {
  return examples.map(example => {
    const d = example.vector.reduce((sum, value, i) => sum + (value - query[i]) ** 2, 0);
    return { kind: example.kind, d };
  }).sort((a, b) => a.d - b.d);
}

const trainSize = 500;
const validationSize = 120;
const neighborCount = 21;

function makeTraining() {
  const rng = randomGenerator(281108);
  return models.flatMap((_, kind) => Array.from({ length: trainSize }, () => ({
    kind,
    vector: features(generate(55, kind, rng))
  })));
}

function classify(input, training) {
  const vector = features(input);
  if (!vector) return null;
  const nearest = distances(vector, training).slice(0, neighborCount);
  const tally = models.map(() => 0);
  for (const { kind } of nearest) tally[kind] += 1;
  const votes = Math.max(...tally);
  const leaders = models.map((_,i) => i).filter(i => tally[i] === votes);
  return { tally, leaders, top:leaders.length === 1 ? leaders[0] : null, distance:Math.sqrt(nearest[0].d) };
}

function validateTraining(training, seed = 964239) {
  const rng = randomGenerator(seed);
  const distances = [];
  const matrix = models.map(() => models.map(() => 0));
  for (let kind = 0; kind < models.length; kind += 1) {
    for (let i = 0; i < validationSize; i += 1) {
      const guess = classify(generate(47, kind, rng), training);
      if (!guess) continue;
      if (guess.top !== null) matrix[kind][guess.top] += 1;
      distances.push(guess.distance);
    }
  }
  distances.sort((a, b) => a - b);
  return {
    matrix,
    correct: matrix.reduce((sum, row, index) => sum + row[index], 0),
    total: validationSize * models.length,
    threshold: distances[Math.floor(0.95 * (distances.length - 1))]
  };
}

const rateBounds = [0.08, 70];
const betaBounds = [0.35, 0.95];

function goldenMinimum(low, high, evaluate, best) {
  const ratio = (Math.sqrt(5) - 1) / 2;
  let left = evaluate(high - ratio * (high - low));
  let right = evaluate(low + ratio * (high - low));
  while (high - low > 1e-12) {
    if (left.sse <= right.sse) {
      high = right.x;
      right = left;
      left = evaluate(high - ratio * (high - low));
    } else {
      low = left.x;
      left = right;
      right = evaluate(low + ratio * (high - low));
    }
  }
  return [best, left, right].sort((a, b) => a.sse - b.sse)[0];
}

function simplexMinimum(initial, steps, bounds, evaluate) {
  const point = x => {
    // Reject infeasible trials without projecting the simplex onto a boundary.
    const outside = x.some((value, i) => value < bounds[i][0] || value > bounds[i][1]);
    return { x, fit:outside ? {sse:Infinity} : evaluate(x) };
  };
  const byError = (a, b) => a.fit.sse - b.fit.sse;
  const simplex = [point(initial), ...initial.map((_, i) => {
    const trial = [...initial];
    trial[i] += (trial[i] + steps[i] <= bounds[i][1] ? 1 : -1) * steps[i];
    return point(trial);
  })];
  for (let iteration = 0; iteration < 280; iteration += 1) {
    simplex.sort(byError);
    const [best, next, worst] = simplex;
    if (Math.max(...[next, worst].flatMap(p => p.x.map((v, i) => Math.abs(v - best.x[i])))) < 1e-10) break;
    const center = best.x.map((value, i) => (value + next.x[i]) / 2);
    const fromWorst = weight => point(center.map((value, i) => value + weight * (value - worst.x[i])));
    const reflected = fromWorst(1);
    if (byError(reflected, best) < 0) {
      const expanded = fromWorst(2);
      simplex[2] = byError(expanded, reflected) < 0 ? expanded : reflected;
    } else if (byError(reflected, next) < 0) {
      simplex[2] = reflected;
    } else {
      const outer = byError(reflected, worst) < 0;
      const contracted = fromWorst(outer ? 0.5 : -0.5);
      if (byError(contracted, outer ? reflected : worst) < 0) {
        simplex[2] = contracted;
      } else {
        simplex[1] = point(next.x.map((value, i) => (value + best.x[i]) / 2));
        simplex[2] = point(worst.x.map((value, i) => (value + best.x[i]) / 2));
      }
    }
  }
  let best = simplex.sort(byError)[0];
  // When a hard wall limits the simplex, finish the search along that face.
  for (const [fixed, edges] of bounds.entries()) {
    const edge = edges.find(value => Math.abs(value - best.x[fixed]) < steps[fixed] * 1e-4);
    if (edge === undefined) continue;
    const free = 1 - fixed;
    const center = best.x[free];
    const low = Math.max(bounds[free][0], center - steps[free]);
    const high = Math.min(bounds[free][1], center + steps[free]);
    const faceAt = x => {
      const coordinates = [...best.x];
      coordinates[fixed] = edge;
      coordinates[free] = x;
      const fit = evaluate(coordinates);
      return {x,coordinates,fit,sse:fit.sse};
    };
    const seed = [faceAt(low),faceAt(center),faceAt(high)].sort((a,b) => a.sse - b.sse)[0];
    const face = goldenMinimum(low,high,faceAt,seed);
    if (face.sse < best.fit.sse) best = {x:face.coordinates,fit:face.fit};
  }
  return best.fit;
}

function fitModels(data) {
  const n = data.length;
  const time = Float64Array.from(data, ([t]) => t);
  const signal = Float64Array.from(data, ([, y]) => y);
  const mean = signal.reduce((sum, value) => sum + value, 0) / n;
  const centered = signal.map(value => value - mean);
  const yy = centered.reduce((sum, value) => sum + value * value, 0);

  function shape(rate, beta = 1, powers) {
    const factor = powers ? rate ** beta : rate;
    const values = new Float64Array(n);
    let sum = 0, squares = 0, xy = 0;
    for (let i = 0; i < n; i += 1) {
      const exponent = powers ? factor * powers[i] : beta === 1 ? rate * time[i] : (rate * time[i]) ** beta;
      const value = Math.exp(-exponent);
      values[i] = value;
      sum += value;
      squares += value * value;
      xy += value * centered[i];
    }
    return { values, sum, variance:squares - sum * sum / n, xy };
  }

  function profile(x, z, exact = false) {
    let xz = 0;
    if (z) {
      for (let i = 0; i < n; i += 1) xz += x.values[i] * z.values[i];
      xz -= x.sum * z.sum / n;
    }
    const xx = x.variance, xy = x.xy;
    const candidates = [[xx > 1e-13 ? Math.max(0, xy / xx) : 0, 0]];
    if (z) {
      const zz = z.variance, zy = z.xy;
      candidates.push([0, zz > 1e-13 ? Math.max(0, zy / zz) : 0]);
      const det = xx * zz - xz * xz;
      if (xx > 0 && zz > 0 && det > 1e-10 * xx * zz) {
        const a = (xy * zz - zy * xz) / det;
        const b = (zy * xx - xy * xz) / det;
        if (a > 0 && b > 0) candidates.push([a,b]);
      }
    }
    let best;
    for (const [a,b] of candidates) {
      const c = mean - (a * x.sum + b * (z?.sum ?? 0)) / n;
      // Active coefficients solve the centered normal equations. Near zero,
      // evaluate residuals directly to avoid cancellation in the moment formula.
      let sse = yy - a * xy - b * (z?.xy ?? 0);
      if (exact || sse <= 1e-8 * yy) {
        sse = 0;
        for (let i = 0; i < n; i += 1) {
          const residual = signal[i] - (c + a * x.values[i] + (z ? b * z.values[i] : 0));
          sse += residual * residual;
        }
      }
      if (!best || sse < best.sse) best = { a,b,c,sse };
    }
    return best;
  }

  const logBounds = rateBounds.map(Math.log);
  const steps = [(logBounds[1] - logBounds[0]) / 50, (betaBounds[1] - betaBounds[0]) / 24];
  const grid = Array.from({length:51}, (_, i) => i === 50 ? logBounds[1] : logBounds[0] + i * steps[0]);
  const rates = grid.map(Math.exp);
  const exponentials = rates.map(rate => shape(rate));
  const betas = Array.from({length:25}, (_, i) => {
    const beta = i === 24 ? betaBounds[1] : betaBounds[0] + i * steps[1];
    return { beta, powers:time.map(value => value ** beta) };
  });
  let single = { sse:Infinity }, double = { sse:Infinity }, stretched = { sse:Infinity };
  for (let i = 0; i < grid.length; i += 1) {
    const logRate = grid[i];
    const estimate = profile(exponentials[i]);
    if (estimate.sse < single.sse) single = { ...estimate, index:i };
    for (let j = i + 1; j < grid.length; j += 1) {
      const fit = profile(exponentials[i], exponentials[j]);
      if (fit.sse < double.sse) double = { ...fit, start:[logRate,grid[j]] };
    }
    for (const {beta,powers} of betas) {
      const fit = profile(shape(rates[i], beta, powers));
      if (fit.sse < stretched.sse) stretched = { ...fit, start:[logRate,beta] };
    }
  }
  const singleAt = x => {
    const rate = Math.exp(x);
    return { ...profile(shape(rate), undefined, true), x, rate, beta:1 };
  };
  const around = single.index;
  single = goldenMinimum(grid[Math.max(0,around - 1)], grid[Math.min(50,around + 1)], singleAt, singleAt(grid[around]));
  double = simplexMinimum(double.start, [steps[0],steps[0]], [logBounds,logBounds], ([x,z]) => {
    const rate = Math.exp(Math.min(x,z)), fast = Math.exp(Math.max(x,z));
    return { ...profile(shape(rate), shape(fast), true), rate, fast, beta:1 };
  });
  if (single.sse <= double.sse) double = {...single, b:0, fast:single.rate};
  stretched = simplexMinimum(stretched.start, steps, [logBounds,betaBounds], ([x,beta]) => {
    const rate = Math.exp(x);
    return { ...profile(shape(rate,beta), undefined, true), rate, beta };
  });

  return [single,double,stretched].map((fit, kind) => {
    const p = [4,6,5][kind];
    const aicc = n * Math.log(Math.max(1e-24, fit.sse / n)) + 2 * p + (2 * p * (p + 1)) / (n - p - 1);
    const predict = t => fit.c + fit.a * Math.exp(-((t * fit.rate) ** fit.beta)) +
      (fit.fast ? fit.b * Math.exp(-t * fit.fast) : 0);
    return { ...fit, kind, aicc, predict };
  }).sort((a,b) => a.aicc - b.aicc);
}

function fittedValues(fit, scaled) {
  const scale = scaled.signalSpan * scaled.divisor;
  const values = {
    rmse:Math.sqrt(fit.sse / scaled.data.length) * scale,
    baseline:scaled.divisor * (scaled.low + fit.c * scaled.signalSpan),
    amplitude:fit.a * scale,
    tau:scaled.duration / fit.rate,
    ...(fit.kind === 1 && {amplitudeFast:fit.b * scale,tauFast:scaled.duration / fit.fast}),
    ...(fit.kind === 2 && {beta:fit.beta})
  };
  if (!(scale > 0) || values.tau === 0 || values.tauFast === 0 || !Object.values(values).every(Number.isFinite)) {
    throw Error("numberRange");
  }
  return values;
}

function analyze(raw, training) {
  const scaled = normalized(raw);
  const fits = fitModels(scaled.data);
  for (const fit of fits) fit.output = fittedValues(fit, scaled);
  const guess = classify(scaled.data, training);
  return { scaled, fits, guess };
}

const fitWarningKeys = ["weak", "close", "boundary", "degenerate"];

function diagnose(result, distanceLimit) {
  const { fits, guess, scaled } = result;
  const top = fits[0];
  const n = scaled.data.length;
  const mean = scaled.data.reduce((sum, [, y]) => sum + y, 0) / n;
  const flatSse = scaled.data.reduce((sum, [, y]) => sum + (y - mean) ** 2, 0);
  const warnings = [];
  const delta = fits[1].aicc - top.aicc;
  if (!(top.sse < 0.80 * flatSse)) warnings.push("weak");
  if (delta < 2) warnings.push("close");
  const nearBound = (value, bounds) => bounds.some(edge => Math.abs(value - edge) < 1e-5 * Math.max(1, edge));
  if (nearBound(top.rate,rateBounds) || (top.kind === 1 && nearBound(top.fast,rateBounds)) ||
    (top.kind === 2 && nearBound(top.beta,betaBounds))) warnings.push("boundary");
  if (top.kind === 1 && (top.fast / top.rate < 1.15 || Math.min(top.a,top.b) < 0.01 * (top.a + top.b))) {
    warnings.push("degenerate");
  }
  if (!guess) {
    warnings.push("unresolvedShape");
    return { warnings, delta, distanceLimit };
  }
  if (guess.top === null) warnings.push("tie");
  else if (guess.top !== top.kind) warnings.push("disagree");
  if (guess.distance > distanceLimit) warnings.push("distance");
  if (guess.top !== null && guess.tally[guess.top] / neighborCount < 0.55) warnings.push("votes");
  return { warnings, delta, distanceLimit };
}

const byId = id => document.getElementById(id);
const textElement = (tag, value) => {
  const element = document.createElement(tag);
  element.textContent = value;
  return element;
};
let locale = "en";
let formatter;
const tr = (key, ...values) => strings[locale][key].replace(/\{(\d+)\}/g, (_, i) => values[i]);
const modelName = kind => strings[locale].names[kind];
const shapeName = guess => !guess ? tr("shapeUnavailable") : guess.top === null
  ? tr("tied",guess.leaders.map(modelName).join(" / ")) : modelName(guess.top);
const format = x => x === 0 ? "0" :
  Math.abs(x) >= 1e5 || Math.abs(x) < 0.001 ? x.toExponential(2) : formatter.format(x);

const percent = (value, count) => count ? (100 * value / count).toFixed(1) + "%" : "—";

const training = makeTraining();
let current;
let dataset;
let requestedCount;
let requestedNoise;
let pendingFit = null;
let lastError = null;

function row(values, useHeading = false) {
  const cells = values.map((value, index) => {
    const heading = useHeading && index === 0;
    const cell = textElement(heading ? "th" : "td", value);
    if (heading) cell.scope = "row";
    return cell;
  });
  const item = document.createElement("tr");
  item.append(...cells);
  return item;
}

function pairs(target, entries) {
  byId(target).replaceChildren(...entries.map(([key, value]) => {
    const group = document.createElement("div");
    group.append(textElement("dt", key), textElement("dd", value));
    return group;
  }));
}

function setLocale(next) {
  locale = next;
  document.documentElement.lang = locale === "en" ? "en" : "zh-CN";
  document.title = "Decay Lab · " + tr("title");
  formatter = new Intl.NumberFormat(document.documentElement.lang, {maximumSignificantDigits:4,useGrouping:false});
  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = tr(el.dataset.i18n);
  byId("language").textContent = locale === "en" ? "中文" : "English";
  byId("language").setAttribute("aria-label", locale === "en" ? "Switch to Chinese" : "切换为英语");
  byId("plot").setAttribute("aria-label", tr("plotAria"));
  byId("residual").setAttribute("aria-label", tr("residualAria"));
  byId("benchmark-rows").replaceChildren(...benchmark.rows.map(item => row([
    tr(item.id), item.total, percent(item.aiccCorrect,item.total), percent(item.knnCorrect,item.total),
    percent(item.clearCount,item.total), percent(item.clearCorrect,item.clearCount)
  ], true)));
  byId("matched-rows").replaceChildren(...benchmark.matched.map(item => row([
    tr(item.id), item.accepted + " / " + item.total,
    item.aiccOnly.errors + " / " + item.accepted, item.fitOnly.errors + " / " + item.accepted, item.combined.errors + " / " + item.accepted,
    item.aiccOnly.doubleAsSingle + " / " + item.aiccOnly.doubleAccepted,
    item.combined.doubleAsSingle + " / " + item.combined.doubleAccepted
  ], true)));
  byId("ablation-note").textContent = tr("fitAblation");
  const paired = benchmark.pairedWindow;
  byId("paired-finding").textContent = tr("pairedFinding", 3 * paired.perModel, paired.fitFlips,
    paired.shapeFlips, paired.shortMistakesWithoutWarnings, paired.flaggedByComparison, paired.shortCorrect, paired.flaggedCorrect);
  if (dataset) { renderData(); showDecision(); }
  if (lastError) showError(lastError);
}

function displayTitle(meta) {
  if (meta.blind) return tr("blindCase");
  return meta.example === undefined ? meta.fileName : tr("sample" + meta.example);
}

function showError(error) {
  lastError = error;
  const message = strings[locale][error.message] ? tr(error.message, error.detail) : tr("importError");
  byId("error").textContent = message + " " + tr("keptData");
}

function evaluateRows(raw) {
  const result = analyze(raw, training);
  return { ...result, raw, diagnostic:diagnose(result, benchmark.distanceLimit) };
}

function setData(raw, meta, noise = null) {
  const full = evaluateRows(raw);
  clearTimeout(pendingFit);
  pendingFit = null;
  dataset = { full, meta, noise, count:raw.length };
  requestedCount = raw.length;
  requestedNoise = noise;
  current = full;
  lastError = null;
  byId("error").textContent = "";
  renderData();
}

function earlyCount() {
  return Math.max(12, Math.round(dataset.full.raw.length / 4));
}

function renderControls() {
  const raw = dataset.full.raw;
  const slider = byId("window-end");
  slider.max = raw.length;
  slider.value = requestedCount;
  slider.disabled = raw.length <= 12;
  const end = raw[requestedCount - 1][0];
  const endpoint = format(end) === format(raw[requestedCount - 2][0]) ? String(end) : format(end);
  slider.setAttribute("aria-valuetext", tr("windowValue", requestedCount, raw.length, endpoint));
  byId("window-count").value = tr("windowCount", requestedCount, raw.length, endpoint);
  byId("window-early").disabled = requestedCount === earlyCount();
  byId("window-full").disabled = requestedCount === raw.length;
  byId("noise-control").hidden = requestedNoise === null;
  if (requestedNoise !== null) {
    byId("noise").value = requestedNoise;
    byId("noise").setAttribute("aria-valuetext", tr("noiseValue", format(requestedNoise)));
    byId("noise-value").value = tr("noiseValue", format(requestedNoise));
    byId("noise-reset").disabled = requestedNoise === Math.round(examples[dataset.meta.example].noise * 1000) / 10;
  }
  byId("export").disabled = !current || pendingFit !== null;
  byId("raw").disabled = pendingFit !== null;
  byId("window-pending").textContent = pendingFit === null ? "" : tr("pending");
}

function applyWindow() {
  pendingFit = null;
  const { meta, full } = dataset;
  if (dataset.noise !== requestedNoise) {
    const updated = evaluateRows(sample(meta.example, requestedNoise / 100));
    dataset = { ...dataset, full:updated, noise:requestedNoise };
  }
  dataset.count = requestedCount;
  if (dataset.count === dataset.full.raw.length) {
    current = dataset.full;
  } else {
    const prefix = dataset.full.raw.slice(0, dataset.count);
    try {
      const result = evaluateRows(prefix);
      const comparison = compareWindow(result, dataset.full);
      if (comparison.fitChanged || comparison.shapeChanged) result.diagnostic.warnings.push("windowChanged");
      current = { ...result, comparison };
    } catch (error) {
      if (!["invalidSpan", "lowVariation", "predictorPrecision", "numberRange"].includes(error.message)) throw error;
      current = null;
    }
  }
  renderData();
}

function requestWindow(count, noise = requestedNoise, debounce = false) {
  requestedCount = count;
  requestedNoise = noise;
  clearTimeout(pendingFit);
  if (debounce) {
    pendingFit = setTimeout(applyWindow, 75);
    renderControls();
  } else {
    applyWindow();
  }
}

function renderData() {
  const { full, meta, count } = dataset;
  const partial = count < full.raw.length;
  renderControls();
  byId("excluded").hidden = !partial;
  byId("extrap-choice").hidden = !partial || !current;
  byId("plot").setAttribute("aria-label", tr(partial ? "windowGraph" : "plotAria"));
  byId("window-summary").textContent = partial
    ? tr("fullReference", modelName(full.fits[0].kind), shapeName(full.guess)) : "";
  byId("dataset").textContent = [
    displayTitle(meta), tr("datapoints", count), tr(meta.source),
    meta.truth === undefined ? "" : tr("truth", modelName(meta.truth))
  ].filter(Boolean).join(" · ");
  byId("case-note").hidden = meta.source !== "measured";
  byId("case-desc").textContent = tr("nistNote");
  byId("knn-help").hidden = !current?.guess;
  if (!current) {
    byId("verdict").dataset.caution = "true";
    byId("verdict-title").textContent = tr("windowUnavailable");
    byId("warnings").hidden = true;
    for (const id of ["warnings", "leaders", "fits", "params", "votes"]) byId(id).replaceChildren();
    drawCharts();
    return;
  }
  const { fits, guess, diagnostic } = current;
  const top = fits[0];
  const hasWarnings = diagnostic.warnings.length > 0;
  byId("verdict").dataset.caution = String(hasWarnings);
  byId("verdict-title").textContent = hasWarnings ? tr("caution") : tr("aligned",modelName(top.kind));
  byId("warnings").hidden = !hasWarnings;
  byId("warnings").replaceChildren(...diagnostic.warnings.map(key => textElement("li",tr(key))));
  pairs("leaders", [[tr("fitLead"), modelName(top.kind)], [tr("shapeLead"), shapeName(guess)]]);

  byId("fits").replaceChildren(...fits.map(fit => row([
    modelName(fit.kind), (fit.aicc - top.aicc).toFixed(2), format(fit.output.rmse)
  ], true)));

  const {baseline, amplitude, amplitudeFast, tau, tauFast, beta} = top.output;
  const params = [["baseline",baseline]];
  if (top.kind === 1) {
    params.push(["slowAmplitude",amplitude], ["slowTau",tau], ["fastAmplitude",amplitudeFast], ["fastTau",tauFast]);
  } else {
    params.push(["amplitude",amplitude], ["tau",tau]);
    if (top.kind === 2) params.push(["beta",beta]);
  }
  pairs("params", params.map(([key,value]) => [tr(key),
    key === "baseline" && format(value) === format(value + amplitude + (amplitudeFast ?? 0)) ? String(value) : format(value)]));

  byId("votes").replaceChildren(...(guess?.tally ?? []).map((votes, kind) => {
    const vote = document.createElement("div");
    vote.className = "vote";
    const meter = document.createElement("meter");
    meter.setAttribute("aria-label", tr("neighborVotes",modelName(kind)));
    meter.max = neighborCount;
    meter.value = votes;
    vote.append(textElement("span",modelName(kind)), meter,
      textElement("strong", Math.round(100 * votes / neighborCount) + "%"));
    return vote;
  }));
  drawCharts();
}

const chartFont = "11px ui-monospace, monospace";

function yAxisTicks(low, high, divisions, formatLabel) {
  return Array.from({length:divisions + 1}, (_,i) => {
    const value = low + (high - low) * i / divisions;
    return {value,label:formatLabel(value)};
  });
}

function drawCharts() {
  if (!dataset) return;
  const { full, count } = dataset;
  const whole = full.scaled;
  const origin = full.raw[0][0];
  const absoluteTime = t => format(origin + whole.duration * t);
  const timeTicks = [0,0.25,0.5,0.75,1].map(absoluteTime);
  const offsetTime = new Set(timeTicks).size < timeTicks.length;
  const timeLabel = offsetTime ? t => format(whole.duration * t) : absoluteTime;
  const predictorTitle = tr(dataset.meta.x || "time");
  byId("predictor-axis").textContent = offsetTime ? tr("offsetAxis", predictorTitle, String(origin)) : predictorTitle;
  const signalLabel = y => format(whole.divisor * (whole.low + whole.signalSpan * y));
  const cutoff = whole.data[count - 1][0];
  function height(fit, t) {
    const part = current.scaled;
    const signal = (part.divisor / whole.divisor) * (part.low + part.signalSpan * fit.predict(t));
    return (signal - whole.low) / whole.signalSpan;
  }
  const series = current ? current.fits.map(fit => Array.from({length:161}, (_, i) => [
    i * cutoff / 160, height(fit,i / 160)
  ])) : [];
  const stretch = current && cutoff < 1 && byId("extrapolate").checked
    ? Array.from({length:121}, (_,i) => {
        const x = cutoff + (1 - cutoff) * i / 120;
        return [x,height(current.fits[0],x / cutoff)];
      })
    : [];
  byId("extrap-legend").hidden = stretch.length === 0;
  const fittedHeights = series.flat().map(([, y]) => y);
  const representable = Number.MAX_VALUE / whole.divisor;
  const low = Math.max((-representable - whole.low) / whole.signalSpan, Math.min(0,...fittedHeights) - 0.05);
  const high = Math.min((representable - whole.low) / whole.signalSpan, Math.max(1,...fittedHeights) + 0.05);
  const residuals = current ? current.scaled.data.map(([x, y]) => [
    x * cutoff, y - current.fits[0].predict(x)
  ]) : [];
  const scale = current ? current.scaled.divisor * current.scaled.signalSpan : 1;
  const abs = Math.min(Number.MAX_VALUE / scale, Math.max(0.007,...residuals.map(([,y]) => Math.abs(y))) * 1.14);
  const rLabel = r => format(r * scale);
  let mainTicks = yAxisTicks(low,high,5,signalLabel);
  const signalTitle = tr(dataset.meta.y || "signal");
  const offsetSignal = new Set(mainTicks.map(tick => tick.label)).size < mainTicks.length;
  if (offsetSignal) {
    const span = whole.signalSpan * whole.divisor;
    mainTicks = yAxisTicks(low,high,5,y => format(span * y));
  }
  byId("signal-axis").textContent = offsetSignal
    ? tr("offsetAxis", signalTitle, String(Math.min(...full.raw.map(([,y]) => y)))) : signalTitle;
  const residualTicks = current ? yAxisTicks(-abs,abs,2,rLabel) : [];
  const plot = byId("plot");
  const measure = plot.getContext("2d");
  measure.save();
  measure.font = chartFont;
  measure.textAlign = "right";
  const margin = Math.max(49, ...[...mainTicks,...residualTicks].map(({label}) => {
    const size = measure.measureText(label);
    return Math.ceil(Math.max(size.width,size.actualBoundingBoxLeft) + 12);
  }));
  measure.restore();
  chart(plot, {
    low, high, xLabel:timeLabel, ticks:mainTicks, margin,
    curves:series, dots:whole.data.slice(0, count), excluded:whole.data.slice(count), cutoff, stretch
  });
  const residualCanvas = byId("residual");
  residualCanvas.hidden = !current;
  if (!current) return;
  chart(residualCanvas, {
    low:-abs, high:abs, xLabel:timeLabel, ticks:residualTicks, margin,
    curves:[], dots:residuals, residual:true, cutoff
  });
}

function chart(canvas, config) {
  const { low, high, xLabel, ticks, curves, dots, residual, margin, excluded = [], cutoff = 1, stretch = [] } = config;
  const bounds = canvas.getBoundingClientRect();
  if (bounds.width < 100) return;
  const ratio = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(bounds.width * ratio);
  canvas.height = Math.round(bounds.height * ratio);
  const ctx = canvas.getContext("2d");
  ctx.scale(ratio, ratio);
  ctx.font = chartFont;
  const axisLeft = margin;
  const axisRight = bounds.width - Math.max(23, ctx.measureText(xLabel(1)).width / 2 + 3);
  const axisTop = 10, axisBottom = bounds.height - 24;
  const x = t => axisLeft + t * (axisRight - axisLeft);
  const y = v => axisBottom - (v - low) / (high - low) * (axisBottom - axisTop);
  if (cutoff < 1) {
    ctx.fillStyle = "#f0f2ef";
    ctx.fillRect(x(cutoff), axisTop, axisRight - x(cutoff), axisBottom - axisTop);
    ctx.strokeStyle = "#90a299";
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(x(cutoff), axisTop);
    ctx.lineTo(x(cutoff), axisBottom);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.lineWidth = 1;
  ctx.strokeStyle = "#dce5df";
  ctx.fillStyle = "#4d6460";
  ctx.textAlign = "right";
  for (const {value,label} of ticks) {
    const py = y(value);
    ctx.beginPath();
    ctx.moveTo(axisLeft, py);
    ctx.lineTo(axisRight, py);
    ctx.stroke();
    ctx.fillText(label, axisLeft - 7, py + 4);
  }
  ctx.textAlign = "center";
  const nx = bounds.width < 405 ? 2 : 4;
  for (let i = 0; i <= nx; i += 1) {
    const t = i / nx;
    ctx.fillText(xLabel(t), x(t), bounds.height - 7);
  }
  if (residual) {
    ctx.strokeStyle = "#778984";
    ctx.beginPath();
    ctx.moveTo(axisLeft, y(0));
    ctx.lineTo(axisRight, y(0));
    ctx.stroke();
  }
  function plotDots(points, color) {
    ctx.fillStyle = color;
    for (const [t, datum] of points) {
      ctx.beginPath();
      ctx.arc(x(t), y(datum), points.length > 400 ? 1.2 : 2.25, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  plotDots(excluded, "#b4bfba");
  plotDots(dots, "rgba(67,83,83,0.67)");
  function line(points, color, width, dash) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.setLineDash(dash);
    ctx.beginPath();
    points.forEach(([t,v], i) => i === 0 ? ctx.moveTo(x(t),y(v)) : ctx.lineTo(x(t),y(v)));
    ctx.stroke();
  }
  ctx.save();
  ctx.beginPath();
  ctx.rect(axisLeft,axisTop,axisRight-axisLeft,axisBottom-axisTop);
  ctx.clip();
  line(stretch, "#528c79", 1.9, [6,5]);
  for (let i = curves.length - 1; i >= 0; i -= 1) {
    line(curves[i], ["#146853","#a26138","#797992"][i], i ? 1.35 : 2.3, i ? [i === 1 ? 4 : 9,4] : []);
  }
  ctx.restore();
}

function download(filename, content, mime) {
  const blobUrl = URL.createObjectURL(new Blob([content], { type: mime }));
  const link = document.createElement("a");
  link.href = blobUrl;
  link.download = filename;
  link.click();
  setTimeout(() => URL.revokeObjectURL(blobUrl), 3000);
}

function loadExample(index) {
  if (index === 4) {
    setData(observedSample(), {example:index,source:"measured",x:"pressure",y:"negativeVolume"});
    return;
  }
  setData(sample(index), {example:index,source:"synthetic",truth:examples[index].kind},
    Math.round(examples[index].noise * 1000) / 10);
}

const samples = byId("sample");
let importGeneration = 0;
samples.addEventListener("input", () => {
  importGeneration += 1;
  loadExample(Number(samples.value));
});

byId("file").addEventListener("change", async event => {
  const file = event.target.files[0];
  if (!file) return;
  const generation = ++importGeneration;
  try {
    if (file.size > 1024 * 1024) throw Error("largeCsv");
    const csv = await file.text();
    if (generation !== importGeneration) return;
    const x = /^\s*"?x"?\s*[,;\t]/i.test(csv) ? "rawX" : "time";
    setData(parseCsv(csv), {fileName:file.name,source:"imported",x});
    samples.selectedIndex = -1;
  } catch (error) {
    if (generation === importGeneration) showError(error);
  } finally {
    if (generation === importGeneration || !event.target.files.length || event.target.files[0] === file) {
      event.target.value = "";
    }
  }
});

byId("window-end").addEventListener("input", event => requestWindow(Number(event.target.value), requestedNoise, true));
byId("noise").addEventListener("input", event => requestWindow(requestedCount, Number(event.target.value), true));
byId("window-early").addEventListener("click", () => requestWindow(earlyCount()));
byId("window-full").addEventListener("click", () => requestWindow(dataset.full.raw.length));
byId("noise-reset").addEventListener("click", () =>
  requestWindow(requestedCount, Math.round(examples[dataset.meta.example].noise * 1000) / 10));

byId("language").addEventListener("click", () => setLocale(locale === "en" ? "zh" : "en"));

byId("extrapolate").addEventListener("change",drawCharts);

byId("raw").addEventListener("click", () => {
  const {meta, full, count} = dataset;
  const predictor = meta.x && meta.x !== "time" ? "x" : "time";
  const csv = predictor + ",signal\n" + full.raw.slice(0, count).map(values => values.join(",")).join("\n") + "\n";
  download("decay-data.csv", csv, "text/csv;charset=utf-8");
});

byId("export").addEventListener("click", () => {
  const {fits,guess,raw,diagnostic} = current;
  const {meta} = dataset;
  const result = {
    dataset:displayTitle(meta), source:meta.source, samples:raw.length, language:locale,
    predictor:meta.x || "time", signal:meta.y || "signal", predictorOrigin:raw[0][0],
    ...(!meta.x || meta.x === "time" ? {timeOrigin:raw[0][0]} : {}),
    ...(meta.source === "measured" ? {reference:"https://www.itl.nist.gov/div898/strd/nls/data/misra1a.shtml"} : {}),
    exampleGroundTruth:meta.truth === undefined ? null : models[meta.truth].key,
    observationWindow: {
      included:raw.length, available:dataset.full.raw.length,
      start:raw[0][0], end:raw.at(-1)[0], fullEnd:dataset.full.raw.at(-1)[0],
      fullAiccLead:models[dataset.full.fits[0].kind].key, fullKnnLead:models[dataset.full.guess?.top]?.key ?? null,
      ...(current.comparison || {fitChanged:false, shapeChanged:guess ? false : null})
    },
    ...(dataset.noise === null ? {} : {simulation:{noiseStandardDeviationFraction:dataset.noise / 100}}),
    verdict:byId("verdict-title").textContent, warnings:diagnostic.warnings,
    distanceToNearest:guess?.distance ?? null, distanceWarningThreshold:diagnostic.distanceLimit,
    fits: fits.map(fit => ({
      model: models[fit.kind].key,
      deltaAicc: fit.aicc - fits[0].aicc,
      ...fit.output
    })),
    knnLeaders:guess?.leaders.map(kind => models[kind].key) ?? [],
    neighbors: guess ? models.map(({ key }, i) => ({ model: key, votes: guess.tally[i], total: neighborCount })) : [],
    syntheticBenchmark:benchmark
  };
  download("decay-analysis.json", JSON.stringify(result, null, 2) + "\n", "application/json");
});

new ResizeObserver(drawCharts).observe(byId("plot"));
const challenge = {stage:0, answers:[]};
const stages = ["challengeEarly","challengeLate","challengeDone"];
function choiceLabel(value) {
  const kind = models.findIndex(model => model.key === value);
  return kind >= 0 ? modelName(kind) : tr(value);
}
function fillChoices(id, keys) {
  const select = byId(id);
  const selected = select.value;
  select.replaceChildren(...["", ...keys].map(key => new Option(key ? choiceLabel(key) : tr("choose"),key)));
  select.value = selected;
}
function showDecision() {
  if (byId("challenge").hidden) return;
  const stage = challenge.stage;
  const done = stage === 2;
  byId("challenge-title").textContent = tr(stages[stage]);
  byId("challenge-evidence").textContent = done ? tr("debrief") : tr("evidence",
    modelName(current.fits[0].kind), current.diagnostic.delta.toFixed(2),
    current.guess.tally[current.guess.top], modelName(current.guess.top), current.raw.length);
  byId("decision").hidden = done;
  byId("save-decision").hidden = !done;
  byId("decision-summary").hidden = !done;
  if (done) {
    const [a,b] = challenge.answers;
    byId("decision-summary").textContent = tr("decisionSummary",choiceLabel(a.model),choiceLabel(a.action),
      choiceLabel(b.model),choiceLabel(b.action));
  } else {
    fillChoices("pick-model", [...models.map(m => m.key),"uncertain"]);
    fillChoices("pick-action", ["stop","more"]);
    byId("advance").textContent = tr(stage === 0 ? "revealMore" : "revealTruth");
  }
}
function loadChallengeStage() {
  const count = challenge.stage === 0 ? 16 : 64;
  setData(sample(1).slice(0,count), {source:"synthetic",blind:true});
  showDecision();
}
function openMode() {
  const blind = location.hash !== "#lab";
  importGeneration += 1;
  document.body.classList.toggle("blind",blind);
  byId("challenge").hidden = !blind;
  byId("challenge-link").hidden = blind;
  byId("intro-text").dataset.i18n = blind ? "challengeIntro" : "intro";
  byId("intro-text").textContent = tr(byId("intro-text").dataset.i18n);
  if (blind) {
    challenge.stage = 0;
    challenge.answers = [];
    byId("decision").reset();
    loadChallengeStage();
  } else {
    samples.value = "1";
    loadExample(1);
  }
}
byId("decision").addEventListener("submit", event => {
  event.preventDefault();
  if (challenge.stage >= 2 || byId("challenge").hidden) return;
  challenge.answers.push({observations:current.raw.length, model:byId("pick-model").value,
    action:byId("pick-action").value, reason:byId("reason").value.trim()});
  challenge.stage += 1;
  byId("decision").reset();
  if (challenge.stage === 1) loadChallengeStage();
  else showDecision();
  byId("challenge-title").focus();
});
byId("save-decision").addEventListener("click", () => {
  if (challenge.stage !== 2) return;
  download("decay-lab-decisions.json", JSON.stringify({activity:"sampling-challenge-v1",
    generatingModel:"double",decisions:challenge.answers},null,2) + "\n","application/json");
});
window.addEventListener("hashchange",openMode);
setLocale("en");
openMode();
</script>
